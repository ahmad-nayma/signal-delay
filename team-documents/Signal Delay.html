<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Delay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
/* Signal Delay. One visual world: mission control at night, built on the team style sheet.
   Layout idea: a three-zone console (step rail, decisions, live telemetry) under a thin status bar. */
:root {
  color-scheme: dark;
  --ink: #0D1B2A;        /* page */
  --navy: #0B1D3A;       /* panels */
  --navy-2: #12294F;     /* raised panels */
  --cyan: #00D2FF;       /* secondary: live values, selection, glow */
  --blue: #0099FF;       /* secondary: links, second role */
  --orange: #FF9900;     /* accent: the one action that matters */
  --amber: #FFAE00;      /* accent: caution */
  --tan: #C68B59;        /* character tone */
  --sand: #D49B6A;       /* character tone */
  --white: #FFFFFF;
  --mute: #9DB2CF;       /* secondary text, navy-biased grey */
  --line: rgba(0, 210, 255, .20);
  --bad: #FF5D6C;        /* semantic: blocked */
  --display: 'Orbitron', 'Eurostile', 'Bank Gothic', 'Trebuchet MS', sans-serif;
  --body: 'JetBrains Mono', 'DejaVu Sans Mono', 'Menlo', 'Consolas', monospace;
  --shadow-1: 0 4px 8px rgba(0, 0, 0, .20);
  --shadow-2: 0 4px 8px rgba(0, 0, 0, .15);
  --shadow-3: 0 2px 4px rgba(0, 0, 0, .10);
  --glow: 0 0 14px #00D2FF;
  --leaf: 14px 4px 14px 4px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--ink);
  background-image: radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55) 50%, transparent 51%), radial-gradient(1px 1px at 68% 9%, rgba(255,255,255,.4) 50%, transparent 51%), radial-gradient(1px 1px at 84% 62%, rgba(255,255,255,.45) 50%, transparent 51%), radial-gradient(1px 1px at 31% 77%, rgba(255,255,255,.35) 50%, transparent 51%), radial-gradient(1px 1px at 52% 41%, rgba(255,255,255,.3) 50%, transparent 51%);
  background-size: 640px 640px;
  color: var(--white); font-family: var(--body); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .02em; }
p { margin: 0; }
a { color: var(--cyan); font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mute { color: var(--mute); }
.eng-only { display: none; }
body.engineer .eng-only { display: revert; }
body.engineer .cadet-only { display: none; }

/* ---------- status bar ---------- */
.bar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 20px; background: rgba(13, 27, 42, .94); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
.brand { font-family: var(--display); font-weight: 900; letter-spacing: .28em; font-size: 15px; background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 10px; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--cyan); box-shadow: var(--glow); display: inline-block; }
.bar .spacer { flex: 1; }
.owlt { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--mute); }
.owlt b { color: var(--cyan); font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 6px 14px; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .12em; color: var(--mute); }
.seg button[aria-pressed="true"] { background: var(--cyan); color: var(--navy); }
.link { background: none; border: 0; color: var(--cyan); font-weight: 600; padding: 4px 2px; font-size: 13px; }
.link:hover { text-decoration: underline; }

/* ---------- buttons ---------- */
.btn { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .08em; padding: 12px 22px; border-radius: var(--leaf); border: 1px solid var(--cyan); background: transparent; color: var(--cyan); box-shadow: var(--shadow-3); transition: box-shadow .15s, transform .15s; }
.btn:hover { box-shadow: var(--glow); }
.btn.primary { background: var(--orange); border-color: var(--orange); color: var(--navy); }
.btn.primary:hover { box-shadow: 0 0 14px var(--orange); }
.btn[disabled] { opacity: .4; cursor: not-allowed; box-shadow: none; }
.btn.small { font-size: 11px; padding: 8px 14px; }

/* ---------- home ---------- */
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px 64px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 40px; align-items: center; padding: 48px 0 36px; }
.eyebrow { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); margin-bottom: 14px; }
.display { font-size: clamp(44px, 8vw, 72px); font-weight: 900; letter-spacing: .06em; text-transform: uppercase; line-height: .98; }
.display span { color: var(--cyan); text-shadow: 0 0 18px rgba(0, 210, 255, .55); }
.lede { font-size: 16px; max-width: 46ch; margin-top: 18px; color: #DCE7F7; }
.lanes { background: var(--navy); border: 1px solid var(--line); border-radius: var(--leaf); padding: 18px 20px; box-shadow: var(--shadow-1); display: grid; gap: 16px; }
.lanes h2 { font-size: 12px; letter-spacing: .2em; color: var(--mute); }
.lane { display: grid; gap: 6px; }
.lane-top { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.lane-top b { font-family: var(--display); letter-spacing: .08em; }
.track { position: relative; height: 14px; }
.track::before { content: ''; position: absolute; left: 6px; right: 6px; top: 6px; border-top: 2px dashed rgba(0, 210, 255, .35); }
.track .earth, .track .body { position: absolute; top: 1px; width: 12px; height: 12px; border-radius: 50%; }
.track .earth { left: 0; background: var(--blue); }
.track .body { right: 0; background: var(--sand); }
.track .pulse { position: absolute; top: 3px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--cyan); box-shadow: var(--glow); }
.lane small { color: var(--mute); font-size: 12px; }

.setup { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 36px; }
.panel { background: var(--navy); border: 1px solid var(--line); border-radius: var(--leaf); padding: 18px; box-shadow: var(--shadow-2); }
.panel h3 { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); margin-bottom: 12px; }
.modes { display: grid; gap: 10px; }
.mode { text-align: left; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.mode b { font-family: var(--display); letter-spacing: .1em; font-size: 15px; }
.mode span { color: var(--mute); font-size: 13px; }
.mode[aria-pressed="true"] { border-color: var(--cyan); box-shadow: var(--glow); }
.count { display: flex; gap: 8px; margin-bottom: 12px; }
.count button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink); font-family: var(--display); font-weight: 700; }
.count button[aria-pressed="true"] { background: var(--cyan); color: var(--navy); border-color: var(--cyan); }
.crew { display: grid; gap: 8px; }
.crew label { display: grid; grid-template-columns: 46px 1fr; align-items: center; gap: 8px; font-size: 12px; }
input[type="text"] { width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; color: var(--white); font: inherit; padding: 8px 10px; }
.tagrole { font-family: var(--display); font-weight: 700; font-size: 10px; letter-spacing: .1em; padding: 3px 6px; border-radius: 4px; color: var(--navy); text-align: center; }
.r-pi { background: var(--cyan); } .r-se { background: var(--blue); } .r-fd { background: var(--orange); } .r-ops { background: var(--sand); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.check input { width: 18px; height: 18px; accent-color: var(--cyan); margin-top: 2px; }

.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 0 0 14px; }
.sec-title h2 { font-size: 24px; text-transform: uppercase; letter-spacing: .08em; }
.missions { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
.mission { text-align: left; background: var(--navy); border: 1px solid var(--line); border-radius: var(--leaf); padding: 16px; display: grid; gap: 10px; align-content: start; box-shadow: var(--shadow-2); transition: box-shadow .15s, transform .15s; }
.mission:hover { box-shadow: var(--glow); transform: translateY(-2px); }
.mission .planet { width: 54px; height: 54px; border-radius: 50%; }
.mission h3 { font-size: 20px; letter-spacing: .08em; text-transform: uppercase; }
.mission .tag { color: var(--cyan); font-size: 12px; letter-spacing: .08em; }
.mission p { color: #DCE7F7; font-size: 13px; }
.mission dl { margin: 0; display: grid; gap: 4px; font-size: 12px; }
.mission dl div { display: flex; justify-content: space-between; gap: 8px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 4px; }
.mission dt { color: var(--mute); } .mission dd { margin: 0; text-align: right; }
.level { display: flex; gap: 4px; } .level i { width: 14px; height: 4px; background: rgba(255,255,255,.18); border-radius: 2px; } .level i.on { background: var(--orange); }
.foot { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--mute); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; }

/* ---------- design console ---------- */
.console { display: grid; grid-template-columns: 210px minmax(0, 1fr) 340px; gap: 18px; max-width: 1400px; margin: 0 auto; padding: 18px 20px 64px; align-items: start; }
.rail { position: sticky; top: 64px; display: grid; gap: 6px; }
.rail .mname { font-family: var(--display); font-size: 18px; letter-spacing: .1em; text-transform: uppercase; }
.rail .cml { font-size: 11px; color: var(--amber); letter-spacing: .06em; margin: 2px 0 10px; }
.stepbtn { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center; text-align: left; background: none; border: 1px solid transparent; border-radius: 10px; padding: 8px 8px; }
.stepbtn .n { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--display); font-size: 11px; font-weight: 700; color: var(--mute); }
.stepbtn .t { font-size: 13px; } .stepbtn .s { display: block; font-size: 10px; color: var(--mute); letter-spacing: .08em; text-transform: uppercase; }
.stepbtn[aria-current="step"] { background: var(--navy); border-color: var(--cyan); box-shadow: var(--glow); }
.stepbtn[aria-current="step"] .n { background: var(--cyan); color: var(--navy); border-color: var(--cyan); }
.stepbtn .dot { width: 8px; height: 8px; border-radius: 50%; } .dot.bad { background: var(--bad); } .dot.warn { background: var(--amber); }
.main { display: grid; gap: 16px; min-width: 0; }
.stephead { display: flex; justify-content: space-between; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
.stephead h2 { font-size: 32px; text-transform: uppercase; letter-spacing: .06em; }
.stephead .why { color: #DCE7F7; max-width: 62ch; margin-top: 8px; font-size: 14px; }
.owner { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mute); }
.group { display: grid; gap: 10px; }
.group > h3 { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--cyan); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.group > h3 small { font-family: var(--body); font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--mute); font-size: 12px; }
.group > p.note { color: var(--mute); font-size: 13px; max-width: 70ch; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.opt { text-align: left; background: var(--navy); border: 1px solid var(--line); border-radius: var(--leaf); padding: 12px 14px; display: grid; gap: 6px; align-content: start; box-shadow: var(--shadow-3); transition: box-shadow .15s, border-color .15s; }
.opt:hover { border-color: var(--cyan); }
.opt.sel { border-color: var(--cyan); box-shadow: var(--glow); background: var(--navy-2); }
.opt.dim { opacity: .55; }
.opt-h { font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .04em; display: flex; justify-content: space-between; gap: 8px; }
.opt-h em { font-style: normal; font-family: var(--body); font-size: 11px; font-weight: 400; color: var(--navy); background: var(--cyan); border-radius: 4px; padding: 1px 6px; align-self: start; white-space: nowrap; }
.opt-d { color: #DCE7F7; font-size: 13px; }
.opt-n { color: var(--amber); font-size: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.chip { font-size: 11px; border: 1px solid rgba(255,255,255,.16); border-radius: 4px; padding: 1px 6px; color: var(--mute); }
.chip b { color: var(--white); font-weight: 600; }
.src { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; border-radius: 3px; padding: 1px 5px; border: 1px solid var(--line); color: var(--cyan); }
.src.est { color: var(--amber); border-color: rgba(255, 174, 0, .4); }
.slider { background: var(--navy); border: 1px solid var(--line); border-radius: var(--leaf); padding: 12px 14px; display: grid; gap: 6px; }
.slider label { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.slider output { color: var(--cyan); font-weight: 600; }
.slider small { color: var(--mute); font-size: 12px; }
input[type="range"] { width: 100%; accent-color: var(--cyan); }
.stepper { display: inline-flex; align-items: center; gap: 10px; }
.stepper button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--ink); font-weight: 700; }
.navrow { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.08); }
.table th { color: var(--mute); font-weight: 400; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.table td.r, .table th.r { text-align: right; }
.scroll { overflow-x: auto; }
details.numbers { background: var(--navy); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px; }
details.numbers summary { cursor: pointer; font-family: var(--display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.plot { background: var(--navy); border: 1px solid var(--line); border-radius: var(--leaf); padding: 8px; }
.plot canvas { width: 100%; height: 240px; display: block; }

/* ---------- telemetry ---------- */
.tele { position: sticky; top: 64px; display: grid; gap: 12px; }
.tip { display: grid; grid-template-columns: 54px 1fr; gap: 10px; align-items: start; background: var(--navy-2); border: 1px solid var(--line); border-radius: var(--leaf); padding: 10px 12px; }
.tip svg { width: 54px; height: 54px; }
.tip b { font-family: var(--display); font-size: 11px; letter-spacing: .14em; color: var(--sand); display: block; }
.tip p { font-size: 13px; }
.tip p + p { color: var(--mute); margin-top: 4px; }
.craft { background: var(--navy); border: 1px solid var(--line); border-radius: var(--leaf); padding: 6px; }
.craft svg { width: 100%; height: auto; display: block; }
.meters { background: var(--navy); border: 1px solid var(--line); border-radius: var(--leaf); padding: 12px 14px; display: grid; gap: 10px; }
.meter { display: grid; gap: 3px; }
.meter-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
.meter-top b { font-family: var(--display); letter-spacing: .1em; font-size: 11px; text-transform: uppercase; }
.meter-top span { color: var(--mute); }
.mbar { position: relative; height: 8px; background: rgba(255,255,255,.08); border-radius: 4px; overflow: hidden; }
.mbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--cyan); transition: width .25s; }
.mbar u { position: absolute; top: -2px; bottom: -2px; width: 2px; background: rgba(255,255,255,.6); }
.meter.tight .mbar i { background: var(--amber); } .meter.bad .mbar i { background: var(--bad); }
.meter small { font-size: 11px; color: var(--mute); }
.meter.tight small { color: var(--amber); } .meter.bad small { color: var(--bad); }
.forecast { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--navy); border: 1px solid var(--line); border-radius: var(--leaf); padding: 10px 14px; }
.forecast b { font-family: var(--display); font-size: 24px; color: var(--cyan); }
.forecast span { font-size: 12px; color: var(--mute); }
.goals { background: var(--navy); border: 1px solid var(--line); border-radius: var(--leaf); padding: 12px 14px; display: grid; gap: 8px; }
.goals h3 { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.goal { display: grid; grid-template-columns: 42px 1fr 18px; gap: 8px; align-items: start; font-size: 12px; }
.tick { font-weight: 700; } .tick.ok { color: var(--cyan); } .tick.no { color: var(--mute); }

/* ---------- review ---------- */
.reqs { display: grid; gap: 6px; }
.req { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; background: var(--navy); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.req.ok { border-color: rgba(0, 210, 255, .35); } .req.no { border-color: rgba(255, 174, 0, .45); }
.issue { background: var(--navy); border-left: 4px solid var(--cyan); border-radius: 4px 10px 10px 4px; padding: 10px 12px; display: grid; gap: 4px; }
.issue.block { border-left-color: var(--bad); } .issue.warn { border-left-color: var(--amber); }
.issue b { font-family: var(--display); font-size: 13px; letter-spacing: .04em; }
.issue .k { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
.issue.block .k { color: var(--bad); } .issue.warn .k { color: var(--amber); } .issue.info .k { color: var(--cyan); }
.issue p { font-size: 13px; color: #DCE7F7; } .issue p.fix { color: var(--mute); }
.mc { display: grid; grid-template-columns: repeat(50, 1fr); gap: 2px; }
.mc i { aspect-ratio: 1; border-radius: 50%; background: var(--cyan); opacity: .85; }
.mc i.launch { background: var(--bad); } .mc i.cruise { background: var(--amber); } .mc i.arrival { background: var(--orange); } .mc i.ops { background: var(--tan); } .mc i.sample { background: var(--blue); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mute); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.poll { display: flex; flex-wrap: wrap; gap: 8px; }
.poll button { border: 1px solid var(--line); background: var(--ink); border-radius: 10px; padding: 8px 12px; display: grid; gap: 2px; text-align: left; min-width: 150px; }
.poll button b { font-family: var(--display); font-size: 13px; letter-spacing: .1em; }
.poll button[aria-pressed="true"] { border-color: var(--cyan); box-shadow: var(--glow); }
.poll button[aria-pressed="true"] b { color: var(--cyan); }
.launchrow { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.spend { display: flex; height: 16px; border-radius: 4px; overflow: hidden; }
.spend i { display: block; }

/* ---------- flight ---------- */
.flight { max-width: 1280px; margin: 0 auto; padding: 18px 20px 64px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.phases { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.phase { font-family: var(--display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--mute); }
.phase.on { background: var(--cyan); color: var(--navy); border-color: var(--cyan); box-shadow: var(--glow); } .phase.done { color: var(--cyan); }
.stage { position: relative; background: #060F1C; border: 1px solid var(--line); border-radius: var(--leaf); overflow: hidden; box-shadow: var(--shadow-1); }
.stage canvas { width: 100%; height: 520px; display: block; }
.hud { position: absolute; left: 14px; top: 12px; display: grid; gap: 2px; pointer-events: none; }
.hud .big { font-family: var(--display); font-size: 22px; color: var(--cyan); text-shadow: 0 0 12px rgba(0,210,255,.5); }
.hud small { color: var(--mute); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
.hud .clock { margin-top: 8px; font-size: 13px; }
.ctrl { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; }
.side { display: grid; gap: 12px; }
.log { background: var(--navy); border: 1px solid var(--line); border-radius: var(--leaf); padding: 12px 14px; max-height: 420px; overflow: auto; display: grid; gap: 8px; align-content: start; }
.log h3 { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.log p { font-size: 13px; border-left: 2px solid var(--line); padding-left: 8px; }
.log p.bad { border-color: var(--bad); } .log p.good { border-color: var(--cyan); } .log p.warn { border-color: var(--amber); }
.log p small { display: block; color: var(--mute); font-size: 11px; }
.crisis { position: fixed; inset: 0; z-index: 40; background: rgba(6, 15, 28, .88); display: grid; place-items: center; padding: 16px; overflow: auto; }
.crisis-card { width: min(680px, 100%); margin: auto; background: var(--navy); border: 1px solid var(--amber); border-radius: var(--leaf); padding: 18px 20px; display: grid; gap: 12px; box-shadow: 0 0 22px rgba(255, 174, 0, .35); }
.crisis-card .k { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--amber); }
.crisis-card h3 { font-size: 24px; text-transform: uppercase; letter-spacing: .04em; }
.crisis-card .real { font-size: 12px; color: var(--mute); border-left: 2px solid var(--tan); padding-left: 10px; }
.crisis-card .delay { font-size: 13px; color: var(--cyan); }
.choice { text-align: left; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 3px; width: 100%; }
.choice:hover:not([disabled]) { border-color: var(--cyan); box-shadow: var(--glow); }
.choice b { font-size: 14px; } .choice span { font-size: 12px; color: var(--mute); } .choice em { font-style: normal; font-size: 12px; color: var(--amber); }
.choice[disabled] { opacity: .45; cursor: not-allowed; }
.transit { display: grid; gap: 8px; }
.transit .track { height: 14px; }
.outcome { font-size: 14px; }

/* ---------- debrief ---------- */
.debrief { max-width: 1180px; margin: 0 auto; padding: 24px 20px 64px; display: grid; gap: 22px; }
.verdict { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; background: var(--navy); border: 1px solid var(--line); border-radius: var(--leaf); padding: 24px; box-shadow: var(--shadow-1); }
.verdict.success { border-color: var(--cyan); box-shadow: var(--glow); } .verdict.failure { border-color: var(--bad); } .verdict.partial { border-color: var(--amber); }
.verdict h1 { font-size: clamp(30px, 5vw, 56px); text-transform: uppercase; letter-spacing: .05em; }
.verdict.success h1 { color: var(--cyan); } .verdict.failure h1 { color: var(--bad); } .verdict.partial h1 { color: var(--amber); }
.verdict p { margin-top: 10px; max-width: 60ch; color: #DCE7F7; font-size: 15px; }
.scorebox { text-align: right; }
.scorebox .n { font-family: var(--display); font-weight: 900; font-size: 64px; line-height: 1; }
.scorebox .of { color: var(--mute); font-size: 12px; }
.stars { color: var(--orange); font-size: 22px; letter-spacing: 4px; } .stars s { color: rgba(255,255,255,.18); text-decoration: none; }
.rank { font-family: var(--display); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.brk { display: grid; gap: 8px; }
.brk-row { display: grid; grid-template-columns: 180px 1fr 84px; gap: 10px; align-items: center; font-size: 13px; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.link-box { background: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 96px; }
.link-box small { display: block; color: var(--mute); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
.link-box b { font-family: var(--display); font-size: 16px; }
.link-box.low b { color: var(--amber); } .link-box.end b { color: var(--cyan); }
.chain .x { align-self: center; color: var(--mute); }
.comic { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.comic figure { margin: 0; background: var(--white); color: var(--navy); border: 3px solid var(--navy); outline: 1px solid var(--cyan); border-radius: 4px 14px 4px 14px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.comic svg { width: 100%; height: auto; display: block; background: #EAF4FF; }
.comic figcaption { padding: 8px 10px 10px; font-size: 12px; line-height: 1.4; border-top: 3px solid var(--navy); }
.comic figcaption b { font-family: var(--display); display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); margin-bottom: 2px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.code { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.code input { flex: 1; min-width: 200px; font-size: 12px; }
.toast { color: var(--cyan); font-size: 12px; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(6, 15, 28, .85); display: grid; place-items: center; padding: 16px; }
.modal-card { width: min(760px, 100%); max-height: min(86vh, 800px); overflow: auto; background: var(--navy); border: 1px solid var(--cyan); border-radius: var(--leaf); padding: 20px 22px; display: grid; gap: 14px; box-shadow: var(--glow); }
.modal-card h2 { font-size: 24px; text-transform: uppercase; letter-spacing: .06em; }
.modal-card dl { margin: 0; display: grid; gap: 10px; }
.modal-card dt { font-family: var(--display); font-size: 13px; letter-spacing: .06em; color: var(--cyan); }
.modal-card dd { margin: 2px 0 0; font-size: 13px; color: #DCE7F7; max-width: 68ch; }
.modal-card ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .console { grid-template-columns: minmax(0, 1fr) 320px; }
  .rail { position: static; grid-column: 1 / -1; grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; padding-bottom: 6px; }
  .rail .head { display: none; }
  .missions { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .comic { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .hero { grid-template-columns: 1fr; padding-top: 28px; gap: 24px; }
  .setup, .cols { grid-template-columns: 1fr; }
  .missions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .console { grid-template-columns: 1fr; }
  .tele { position: static; order: 2; }
  .main { order: 3; }
  .flight { grid-template-columns: 1fr; }
  .stage canvas { height: 380px; }
  .verdict { grid-template-columns: 1fr; } .scorebox { text-align: left; }
  .stephead h2 { font-size: 24px; }
  .brk-row { grid-template-columns: 96px 1fr 60px; }
}
@media (max-width: 460px) {
  .missions { grid-template-columns: 1fr; }
  .comic { grid-template-columns: 1fr; }
  .bar { padding: 8px 16px; gap: 10px; }
  .owlt span { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    var mp = e.massParts, nums = '<details class="numbers eng-only" open><summary>Mass and power budgets</summary><div class="scroll"><table class="table"><thead><tr><th>Mass</th><th class="r">kg</th><th>Power</th><th class="r">W</th></tr></thead><tbody>' +

    return group('Propulsion', src(true, 'costs are game estimates'), '<div class="opts">' + props + '</div>', 'Specific impulse, Isp, is fuel economy: how long one kilogram of propellant can produce one kilogram of thrust. Higher is better.') +

  function stepPayload(e) {

    var p2 = lostLaunch ? '<svg viewBox="0 0 240 150"><path d="M0 128 h240 v22 h-240 z" fill="#0B1D3A"/><path d="M120 30 l10 24 l26 -8 l-14 22 l22 14 l-26 4 l4 26 l-22 -16 l-22 16 l4 -26 l-26 -4 l22 -14 l-14 -22 l26 8 z" fill="#FF9900" stroke="#0B1D3A" stroke-width="3"/><circle cx="120" cy="76" r="14" fill="#FFAE00"/></svg>'
      : '<svg viewBox="0 0 240 150"><path d="M0 128 h240 v22 h-240 z" fill="#0B1D3A"/><g stroke="#0B1D3A" stroke-width="3"><path d="M108 96 v-56 q12 -22 24 0 v56 z" fill="#FFFFFF"/><path d="M108 96 l-12 12 h12 z M132 96 l12 12 h-12 z" fill="#0099FF"/><path d="M112 98 q8 34 16 0 z" fill="#FF9900"/></g><circle cx="120" cy="58" r="6" fill="#00D2FF" stroke="#0B1D3A" stroke-width="2"/><g fill="#FFFFFF" stroke="#0B1D3A" stroke-width="2"><circle cx="82" cy="124" r="13"/><circle cx="104" cy="130" r="11"/><circle cx="140" cy="130" r="12"/><circle cx="162" cy="124" r="13"/></g></svg>';
    var p3 = '<svg viewBox="0 0 240 150"><rect width="240" height="150" fill="#0B1D3A"/><g fill="#FFFFFF"><circle cx="30" cy="22" r="1.2"/><circle cx="96" cy="40" r="1"/><circle cx="200" cy="18" r="1.3"/><circle cx="150" cy="120" r="1"/><circle cx="60" cy="90" r="1"/></g><circle cx="34" cy="118" r="16" fill="#0099FF"/><path d="M46 106 Q110 30 172 52" fill="none" stroke="#00D2FF" stroke-width="2.5" stroke-dasharray="3 7"/><g transform="translate(186 56) rotate(-18)">' + craft + '</g>' + (evn ? '<g transform="translate(206 26)"><circle r="13" fill="#FFAE00" stroke="#FFFFFF" stroke-width="2"/><text y="6" text-anchor="middle" font-size="18" font-weight="700" font-family="monospace" fill="#0B1D3A">!</text></g>' : '') + '<text x="92" y="112" font-size="11" font-family="monospace" fill="#00D2FF">' + esc(evn ? dur(evn.owlt) : dur(e.owltMin * 60)) + '</text></svg>';
    var bars = ok ? [34, 52, 44, 66] : part ? [30, 12, 22, 8] : [6, 4, 0, 0];
    var p4 = '<svg viewBox="0 0 240 150">' + (ok ? '<g fill="#FF9900"><rect x="20" y="20" width="6" height="6" transform="rotate(20 23 23)"/><rect x="210" y="28" width="6" height="6" transform="rotate(50 213 31)"/><rect x="60" y="12" width="5" height="5"/></g><g fill="#00D2FF"><rect x="184" y="14" width="6" height="6" transform="rotate(30 187 17)"/><rect x="36" y="48" width="5" height="5"/><rect x="224" y="62" width="5" height="5"/></g>' : '') +
      '<rect x="16" y="52" width="104" height="80" fill="#FFFFFF" stroke="#0B1D3A" stroke-width="3"/>' + bars.map(function (b, i) { return '<rect x="' + (28 + i * 22) + '" y="' + (122 - b) + '" width="14" height="' + Math.max(1, b) + '" fill="' + (ok ? '#00D2FF' : part ? '#FFAE00' : '#FF5D6C') + '" stroke="#0B1D3A" stroke-width="2"/>'; }).join('') + '<path d="M24 122 h88" stroke="#0B1D3A" stroke-width="2"/>' + echoAt(132, 44, 92, ok ? 'happy' : part ? 'worried' : 'sad') + '</svg>';
    var c1 = e.insts.length + (e.insts.length === 1 ? ' instrument, ' : ' instruments, ') + fmt(e.wet) + ' kg and $' + fmt(e.cost.total) + 'M to ' + e.obj.title.charAt(0).toLowerCase() + e.obj.title.slice(1) + '.';
    var c2 = lostLaunch ? 'The rocket fails on the way up. It happens to about one launch in ' + Math.round(1 / Math.max(0.001, e.risk.launch)) + '.' : e.lv.name + ' throws it onto its route. ' + days(e.cruiseDays) + ' of cruise ahead.';
    var c3 = lostLaunch ? 'There is no signal to wait for.' : evn ? evn.title + '. The team chose to ' + evn.choice.charAt(0).toLowerCase() + evn.choice.slice(1) + ', with ' + dur(evn.owlt) + ' between Earth and the spacecraft.' : 'Nothing went wrong on the way. That is rarer than it sounds.';
    var c4 = ok ? pct(r.sc.sciAchieved) + ' of the science objective is home. ' + r.sc.total + ' points.' : part ? 'Some science came home: ' + pct(r.sc.sciAchieved) + ' of the objective. ' + r.sc.total + ' points.' : 'No science this time. The next design starts with what this one taught. ' + r.sc.total + ' points.';
    return '<div class="comic">' + [['1 · The plan', p1, c1], ['2 · Launch day', p2, c2], ['3 · The long silence', p3, c3], ['4 · The verdict', p4, c4]].map(function (p) { return '<figure>' + p[1] + '<figcaption><b>' + p[0] + '</b>' + esc(p[2]) + '</figcaption></figure>'; }).join('') + '</div>';
  }
  UI.debriefView = function () {
    var r = S.result; if (!r) return '<div class="wrap"><p style="padding:40px 0">Fly a mission first.</p></div>';
    var e = E.evaluate(r.D, { mode: r.mode, sandbox: r.sandbox }), sc = r.sc, d = e.d, real = E.REAL[d.real];
    var title = { success: 'Mission success', partial: 'Partial success', failure: r.lostAt ? 'Mission lost' : 'Objective not met' }[sc.outcome];
    var line = sc.outcome === 'success' ? 'Your spacecraft returned ' + pct(sc.sciAchieved) + ' of its science objective over ' + e.years + (e.years === 1 ? ' year at ' : ' years at ') + d.name + '.' : (r.cause || 'The spacecraft survived every phase, but returned only ' + pct(sc.sciAchieved) + ' of the science objective. The science chain below shows where the rest went.');
    var rank = ['Trainee', 'Flight Controller', 'Systems Lead', 'Mission Manager', 'Chief Engineer'][sc.stars - 1], stars = ''; for (var i = 1; i <= 5; i++) stars += i <= sc.stars ? '★' : '<s>★</s>';
    var names = { science: 'Science returned', reliability: 'Design reliability', budget: 'Budget', margins: 'Engineering margins', schedule: 'Schedule', crisis: 'Crisis decisions' };
    var brk = Object.keys(names).map(function (k) { var v = sc.parts[k], m = sc.max[k], cls = v / m > 0.75 ? 'ok' : v / m > 0.4 ? 'tight' : 'bad'; return '<div class="brk-row meter ' + cls + '" style="display:grid"><span>' + names[k] + '</span><div class="mbar"><i style="width:' + (v / m * 100).toFixed(0) + '%"></i></div><span class="num" style="text-align:right">' + Math.round(v) + ' / ' + m + '</span></div>'; }).join('') + (sc.team != null && S.players.length > 1 ? '<div class="brk-row"><span>Team goals met</span><span class="mute">' + r.met.filter(Boolean).length + ' of 4 departments</span><span class="num" style="text-align:right">+' + sc.team + '</span></div>' : '');
    function box(l, v, low, end) { return '<div class="link-box' + (low ? ' low' : '') + (end ? ' end' : '') + '"><small>' + l + '</small><b class="num">' + v + '</b></div>'; }
    var chain = '<div class="chain">' + box('Instruments', e.sciRaw.toFixed(1) + ' pts') + '<span class="x">×</span>' + box('Orbit', e.orbF.toFixed(2), e.orbF < 0.8) + '<span class="x">×</span>' + box('Data returned', e.dataFrac.toFixed(2), e.dataFrac < 0.95) + '<span class="x">×</span>' + box('Time on station', e.durF.toFixed(2), e.durF < 0.9) + '<span class="x">×</span>' + box('Flight events', (r.reachedOps ? r.sciMult * r.opsFrac : 0).toFixed(2), !r.reachedOps || r.sciMult * r.opsFrac < 0.9) + '<span class="x">÷</span>' + box('Goal', e.obj.goal + ' pts') + '<span class="x">=</span>' + box('Science', pct(sc.sciAchieved), false, true) + '</div>';
    // why it went this way
    var why = [];
    if (r.lostAt === 'launch') why.push(['block', 'Lost at launch', 'No design choice caused this. ' + e.lv.name + ' has a ' + (e.lv.rel * 100).toFixed(1) + '% record, so about ' + Math.round((1 - e.lv.rel) * 500) + ' in 500 flights end here. A more proven rocket lowers the odds.']);
    if (r.lostAt === 'cruise') why.push(['block', 'Lost in cruise', 'Cruise risk was ' + (e.risk.cruise * 100).toFixed(1) + '% for this design. ' + (r.D.computer === 'basic' ? 'A single computer with no backup nearly doubled it. ' : '') + (r.D.schedule === 'fast' ? 'The fast-track test campaign raised it by half. ' : '') + (e.cruiseDays > 700 ? 'A cruise of ' + days(e.cruiseDays) + ' gives faults a long time to appear.' : '')]);
    if (r.lostAt === 'arrival') why.push(['block', 'Lost at arrival', 'Arrival risk was ' + (e.risk.arrival * 100).toFixed(1) + '% before flight events. ' + (e.dvMargin < 0.10 ? 'A fuel margin of only ' + pct(e.dvMargin) + ' multiplied it. ' : '') + (e.owltMin > 5 && !r.D.extras.autonomy ? 'With ' + Math.round(e.owltMin) + ' minutes of signal delay and no autonomy, the spacecraft flew the burn alone. ' : '') + 'Orbit insertion is a single burn that cannot be repeated.']);
    if (r.lostAt === 'ops') why.push(['warn', 'Failed during science', 'Yearly failure odds were ' + (e.risk.opsPerYear * 100).toFixed(1) + '%. ' + (e.radF > 1.3 ? 'Radiation in this orbit multiplied them by ' + e.radF.toFixed(1) + '. ' : '') + (e.powerMargin < 0.10 ? 'A thin power margin made brownouts likely. ' : '') + (!e.eclOK ? 'The battery was too small for the shadow passes. ' : '')]);
    if (r.lostAt === 'sample') why.push(['warn', 'Capsule lost on return', 'Sample return adds one more event that must work first time. An extended test campaign lowers the odds.']);
    r.events.forEach(function (x) { why.push([x.tone === 'bad' ? 'block' : x.tone === 'warn' ? 'warn' : 'info', x.title, 'You chose to ' + x.choice.charAt(0).toLowerCase() + x.choice.slice(1) + ', with a signal delay of ' + dur(x.owlt) + '. ' + x.text]); });
    if (r.reachedOps && e.dataFrac < 0.95) why.push(['warn', 'The data link held the science back', 'Instruments recorded ' + e.genGB.toFixed(1) + ' GB a day and the link returned ' + e.downGB.toFixed(2) + '. ' + pct(1 - e.dataFrac) + ' of the measurements never left the spacecraft.']);
    if (r.reachedOps && e.orbF < 0.8) why.push(['info', 'The orbit limited the instruments', 'This orbit delivers ' + e.orbF.toFixed(2) + ' of the best possible return for the objective. A better orbit costs more fuel to enter.']);
    if (e.sciRaw / e.obj.goal < 0.9) why.push(['info', 'The payload was light for the objective', 'The instruments were worth ' + e.sciRaw.toFixed(1) + ' points against a goal of ' + e.obj.goal + '.']);
    e.sciItems.forEach(function (x) { if (x.note) why.push(['info', E.INST[x.id].name + ' underperformed', 'Reason: ' + x.note + '.']); });
    if (!e.sandbox && sc.cost > e.budget) why.push(['warn', 'Over the cost cap', 'Final cost was $' + fmt(sc.cost) + 'M against a cap of $' + fmt(e.budget) + 'M.']);
    var whyHTML = why.slice(0, 7).map(function (w) { return '<div class="issue ' + w[0] + '"><b>' + esc(w[1]) + '</b><p>' + esc(w[2]) + '</p></div>'; }).join('') || '<p class="mute">Nothing went wrong, and the design had margin everywhere. Try a harder destination or Engineer mode.</p>';
    var next = e.reqs.filter(function (q) { return !q.ok; }).map(function (q) { return ({ sci: 'Raise the science return: add an instrument that scores for this objective, or fix whatever is holding the chain back.', mass: 'Give the launch more mass margin with a lighter spacecraft or a larger rocket.', dv: 'Carry at least 10% spare fuel.', power: 'Add power generation or a larger battery.', data: 'Open up the data link: larger dish, stronger transmitter or 70 m stations.', budget: 'Find savings. The Review step shows where the money goes.', time: 'Shorten the route or the science phase to meet the deadline.', risk: 'Lower the risk with redundancy, autonomy or a longer test campaign.' })[q.id]; });
    var nextHTML = next.length ? '<ul>' + next.map(function (n) { return '<li>' + n + '</li>'; }).join('') + '</ul>' : '<p class="mute">Every requirement was closed. To score higher, trim cost while keeping the margins, or try another objective.</p>';
    var cmp = '<div class="scroll"><table class="table"><thead><tr><th></th><th class="r">Your design</th><th class="r">' + real.name + ' (' + real.year + ')</th></tr></thead><tbody>' +
      '<tr><th>Launch mass</th><td class="r num">' + fmt(e.wet) + ' kg</td><td class="r num">' + fmt(real.wet) + ' kg</td></tr><tr><th>Dry mass</th><td class="r num">' + fmt(e.dry) + ' kg</td><td class="r num">' + fmt(real.dry) + ' kg</td></tr>' +
      '<tr><th>Power at destination</th><td class="r num">' + fmt(e.pGen) + ' W</td><td class="r num">' + (real.power ? 'about ' + fmt(real.power) + ' W' : '–') + '</td></tr><tr><th>Launch vehicle</th><td class="r">' + e.lv.name + '</td><td class="r">' + real.lv + '</td></tr>' +
      '<tr><th>Cruise</th><td class="r num">' + days(e.cruiseDays) + '</td><td class="r num">' + real.cruise + '</td></tr><tr><th>Total cost</th><td class="r num">$' + fmt(sc.cost) + 'M</td><td class="r num">' + (real.cost ? 'about $' + fmt(real.cost) + 'M' : '–') + '</td></tr></tbody></table></div><p class="mute" style="font-size:12px;margin-top:8px">' + real.note + '</p>';
    var hist = S.history.length > 1 ? '<section class="panel"><h3>Your attempts at this mission</h3><div class="scroll"><table class="table"><thead><tr><th>#</th><th>Result</th><th class="r">Science</th><th class="r">Cost</th><th class="r">Launch mass</th><th class="r">Forecast</th><th class="r">Score</th></tr></thead><tbody>' + S.history.map(function (h) { return '<tr><td class="num">' + h.n + '</td><td>' + ({ success: 'Success', partial: 'Partial', failure: 'Failed' })[h.outcome] + '</td><td class="r num">' + pct(h.sci) + '</td><td class="r num">$' + fmt(h.cost) + 'M</td><td class="r num">' + fmt(h.wet) + ' kg</td><td class="r num">' + pct(h.p) + '</td><td class="r num">' + h.score + '</td></tr>'; }).join('') + '</tbody></table></div></section>' : '';
    return '<div class="debrief"><section class="verdict ' + sc.outcome + '"><div><p class="eyebrow">' + d.name + ' · ' + e.obj.title + ' · ' + (r.mode === 'cadet' ? 'Cadet' : 'Engineer') + (r.sandbox ? ' · Sandbox' : '') + '</p><h1>' + title + '</h1><p>' + esc(line) + '</p></div><div class="scorebox"><div class="n num">' + sc.total + '</div><div class="of">of ' + (S.players.length > 1 ? '1,060' : '1,000') + ' points</div><div class="stars" aria-label="' + sc.stars + ' of 5 stars">' + stars + '</div><div class="rank">' + rank + '</div></div></section>' +
      '<section class="actions"><button type="button" class="btn primary" data-act="again">Change the design and fly again</button><button type="button" class="btn" data-act="newmission">Choose another mission</button><button type="button" class="link" data-act="modal" data-v="board">Leaderboard</button></section>' +
      '<section class="panel"><h3>The mission in four panels</h3>' + comic(r, e) + '</section>' +
      '<div class="cols"><section class="panel"><h3>Score breakdown</h3><div class="brk">' + brk + '</div></section><section class="panel"><h3>Where the science went</h3>' + chain + '<p class="mute" style="font-size:12px;margin-top:10px">Each box takes its share of what the instruments could have returned. Amber boxes cost you the most.</p></section></div>' +
      '<div class="cols"><section class="panel"><h3>Why it went this way</h3><div style="display:grid;gap:8px">' + whyHTML + '</div></section><section class="panel"><h3>What to try next</h3>' + nextHTML + '<h3 style="margin-top:18px">Against the real mission</h3>' + cmp + '</section></div>' + hist + '</div>';
  };
})();

</script>
<script>
(function () {
  var hot = window.claude && window.claude.hot;
  function start(data) { window.SDUI.boot(data); }
